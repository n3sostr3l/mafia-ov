spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/overlay}
    username: ${DATABASE_USER:overlay}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  error:
    include-message: never
    include-stacktrace: never
app:
  public-url: ${PUBLIC_URL:http://localhost:8088}
  uploads: ${UPLOAD_PATH:./data/uploads}
  dev: false
logging:
  level:
    org.springframework.security: WARN
