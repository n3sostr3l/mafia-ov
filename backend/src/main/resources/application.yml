spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/overlay}
    username: ${DATABASE_USER:overlay}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
server:
  error:
    include-message: never
    include-stacktrace: never
app:
  public-url: ${PUBLIC_URL:http://localhost:8088}
  uploads: ${UPLOAD_PATH:./data/uploads}
  dev: false
  polemica:
    base-url: ${POLEMICA_BASE_URL:https://app.polemicagame.com}
    authorization: ${POLEMICA_AUTHORIZATION:}
    api-token: ${POLEMICA_API_TOKEN:}
    cookie: ${POLEMICA_COOKIE:}
logging:
  level:
    org.springframework.security: WARN
