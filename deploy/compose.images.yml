services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: overlay
      POSTGRES_USER: overlay
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U overlay -d overlay"]
      interval: 5s
      timeout: 5s
      retries: 15
    mem_limit: 256m
    restart: unless-stopped
  backend:
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE}/polemica-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/overlay
      DATABASE_USER: overlay
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      UPLOAD_PATH: /app/data/uploads
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
  web:
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE}/polemica-web:${IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
    mem_limit: 64m
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
