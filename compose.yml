services:
  db:
    ports:
      - "25432:5432"
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: overlay
      POSTGRES_USER: overlay
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U overlay -d overlay"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/overlay
      DATABASE_USER: overlay
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
      UPLOAD_PATH: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
